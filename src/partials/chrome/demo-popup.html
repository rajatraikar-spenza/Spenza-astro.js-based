<!--
  The lead-capture modal behind every "book your demo now" / "Get Started"
  button on the mirrored marketing pages.

  It began as an Elementor HTML widget sitting in a container near the foot of
  the home page, which is why only the home page had a working button: the
  fourteen other pages carry the same `.get-started` widgets and the same
  extracted handler, and that handler opens `#emailPopup-1` — an element that
  existed on exactly one of them. `openPopup()` returned early and the click
  did nothing, silently.

  Rendered by WpLayout at the end of `<body>`, once, for any page whose partial
  has a `.get-started` button. Being outside `main` also takes it out of the
  `content-visibility: auto` subtree that wp-polish.css had to carve an
  exception for — a fixed child of a skipped container is not painted, which
  looked like the same dead button for a different reason.

  The close button calls `closePopupOne()`, not the `closePopup()` the home
  page's copy called: the extracted page scripts define `window.closePopupOne`
  on all fifteen pages, and `window.closePopup` on the home page alone.

  The styling is already in every one of these pages' inline stylesheet —
  purged out until now for want of markup to match. Re-run
  `npm run wp:optimize-css` after touching this file.
-->
