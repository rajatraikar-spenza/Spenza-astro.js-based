<style>.spenza-draft-content .uagb-faq-item{background:#f6f6f6;border:0;border-radius:20px;margin-bottom:10px;overflow:hidden}.spenza-draft-content .uagb-faq-questions-button{display:flex;align-items:center;padding:20px;cursor:pointer}.spenza-draft-content .uagb-faq-icon-wrap{display:flex;align-items:center;margin-right:10px}.spenza-draft-content .uagb-faq-icon-wrap svg{width:12px;height:12px;flex-shrink:0}.spenza-draft-content .uagb-question{width:100%}.spenza-draft-content .uagb-faq-content{padding:0 20px 20px;display:none}.spenza-draft-content .uagb-faq-item-active .uagb-faq-content{display:block}.spenza-draft-content .uagb-faq-content p{margin:0}.spenza-draft-content .uagb-icon-active,.spenza-draft-content .uagb-faq-item-active .uagb-icon{display:none}.spenza-draft-content .uagb-faq-item-active .uagb-icon-active{display:flex}</style>
<script data-spenza-faq-support="1">(function(){function ready(){if(document.body.classList.contains("wp-mirror"))return;document.querySelectorAll(".spenza-draft-content .uagb-faq__outer-wrap").forEach(function(block){var items=Array.from(block.querySelectorAll(".uagb-faq-item"));function set(item,open){item.classList.toggle("uagb-faq-item-active",open);item.querySelector(".uagb-faq-questions-button").setAttribute("aria-expanded",String(open));item.querySelector(".uagb-faq-content").style.display=open?"block":"none";}items.forEach(function(item,i){function toggle(){var open=item.classList.contains("uagb-faq-item-active");items.forEach(function(other){set(other,other===item&&!open);});}item.querySelector(".uagb-faq-questions-button").addEventListener("click",function(e){e.preventDefault();toggle();});item.addEventListener("keydown",function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();toggle();}});set(item,i===0);});});}if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",ready);else ready();})();</script>
