# Decap CMS for spenza.com/admin. Reachable by URL only: not linked from the site,
# not in the sitemap, llms.txt or robots.txt, and served noindex.
#
# Login is GitHub: the OAuth proxy (admin-api/oauth) only issues a token to a
# person with push access to this repository, so "can log in" means "is on the
# repo". The editorial workflow gives the three stages the team asked for:
#   Draft -> In review -> Ready, then Publish (merges the pull request; the
#   merge to main is what deploys the site).
backend:
  name: github
  repo: rajatraikar-spenza/Spenza-astro.js-based
  branch: main
  # GO-LIVE: replace with the OAuth proxy URL printed by
  # scripts/admin-oauth-deploy.sh (no trailing slash). See docs/admin-platform.
  base_url: https://3cet5dp4zfk3hy2gtihlbzlude0fdxkc.lambda-url.us-east-1.on.aws
  auth_endpoint: auth

# Only takes effect on localhost with `npm run admin:local` (decap-server).
local_backend: true

publish_mode: editorial_workflow

media_folder: public/cms-media
public_folder: /cms-media

site_url: https://spenza.com
display_url: https://spenza.com
logo_url: https://spenza.com/favicon.svg
locale: en

collections:
  - name: blog
    label: Blog
    label_singular: Blog post
    folder: src/content/cms-blog
    extension: mdx
    format: frontmatter
    create: true
    # The file name must equal the slug: the site builds /<category>/<slug>/ from it.
    slug: "{{fields.slug}}"
    identifier_field: slug
    # Posts imported from WordPress are in the next collection ("Imported posts"); this one is posts written here.
    filter: { field: source, value: admin }
    summary: "{{title}} · {{category}} · {{publishedDate | date('YYYY-MM-DD')}}"
    sortable_fields: [publishedDate, title, category]
    fields:
      - { label: Source, name: source, widget: hidden, default: admin }
      - { label: Title, name: title, widget: string }
      - label: Slug
        name: slug
        widget: string
        pattern: ['^[a-z0-9]+(?:-[a-z0-9]+)*$', "Lowercase letters, numbers and hyphens only."]
        hint: "The URL ends with this. Permanent once published: changing it breaks links."
      - label: Category
        name: category
        widget: relation
        collection: settings
        file: categories
        search_fields: ["categories.*.label"]
        value_field: "categories.*.slug"
        display_fields: ["categories.*.label"]
        hint: "Also the URL: /<category>/<slug>/. Add new ones under Settings > Categories."
      - label: Author
        name: author
        widget: relation
        collection: settings
        file: authors
        search_fields: ["authors.*.name"]
        value_field: "authors.*.slug"
        display_fields: ["authors.*.name"]
        hint: "Add people under Settings > Authors."
      - label: Description
        name: description
        widget: text
        hint: "110-165 characters. Used as the search snippet, the social description and the card text."
      - { label: Publish date, name: publishedDate, widget: datetime, hint: "A future date holds the post back until that day." }
      - { label: Updated date, name: updatedDate, widget: datetime, required: false, hint: "Set only after a substantial edit." }
      - { label: Focus keyword, name: focusKeyword, widget: string, required: false }
      - label: Tags
        name: tags
        widget: relation
        collection: settings
        file: tags
        multiple: true
        required: false
        default: []
        search_fields: ["tags.*.label"]
        value_field: "tags.*.slug"
        display_fields: ["tags.*.label"]
        hint: "Each tag gets a page at /tag/<tag>/. Add new ones under Settings > Tags."
      - { label: SEO title, name: seoTitle, widget: string, required: false, hint: "Only if it should differ from the title. 70 characters or fewer." }

      - label: Hero image
        name: hero
        widget: object
        hint: "The featured image and social card. 1280x720 WebP, under 200 KB."
        fields:
          - { label: Image, name: image, widget: image }
          - { label: Alt text, name: alt, widget: string, hint: "Describe what the image shows. Never the title." }

      - label: Body image
        name: bodyImage
        widget: object
        required: false
        fields:
          - { label: Image, name: image, widget: image, required: false }
          - { label: Alt text, name: alt, widget: string, required: false }
          - { label: Caption, name: caption, widget: string, required: false }
          - { label: Show after section, name: afterSection, widget: number, value_type: int, min: 1, default: 2, hint: "The image appears at the end of this numbered section." }

      - label: TL;DR block
        name: tldr
        widget: object
        required: false
        hint: "The summary and five cards at the top. Leave empty to skip the block; otherwise it needs exactly 5 cards."
        fields:
          - { label: Summary, name: summary, widget: text, required: false, hint: "Two to four sentences that answer the title." }
          - label: Cards
            name: cards
            widget: list
            required: false
            min: 5
            max: 5
            hint: "Cards 1-4 are key points. Card 5 is the 'how Spenza helps' card."
            summary: "{{fields.title}}"
            fields:
              - { label: Icon, name: icon, widget: string, default: chart-line, hint: "A Font Awesome 6 solid name, e.g. chart-line, coins, circle-check, clipboard-check, gears." }
              - { label: Title, name: title, widget: string }
              - { label: Text, name: text, widget: text, hint: "One sentence, 160 characters or fewer." }

      - label: FAQ
        name: faq
        widget: list
        required: false
        summary: "{{fields.question}}"
        hint: "Five questions is the standard. Written as a search query; answered in 2-4 sentences."
        fields:
          - { label: Question, name: question, widget: string }
          - { label: Answer, name: answer, widget: text }

      - label: Body
        name: body
        widget: markdown
        modes: [rich_text, raw]
        buttons: [bold, italic, code, link, heading-two, heading-three, quote, bulleted-list, numbered-list]
        editor_components: [spenza-image, spenza-embed, spenza-button, spenza-callout]
        hint: "Use ## for sections and ### inside them (the title is already the H1). The + menu adds an image, a video, a button or a callout. Tables are supported."

  # The posts that were on WordPress, moved here as they were. Their body is the HTML WordPress stored
  # (some posts carry hand-built tables, cards and styles), so it is edited as HTML, not rich text.
  - name: blog_imported
    label: Imported posts
    label_singular: Imported post
    description: "The posts that were published on WordPress before the admin. Fields, TL;DR cards and the HTML body are all editable here."
    folder: src/content/cms-blog
    extension: mdx
    format: frontmatter
    create: false
    delete: false
    slug: "{{fields.slug}}"
    identifier_field: slug
    filter: { field: source, value: wordpress }
    summary: "{{title}} · {{category}} · {{publishedDate | date('YYYY-MM-DD')}}"
    sortable_fields: [publishedDate, title, category]
    fields:
      - { label: Source, name: source, widget: hidden, default: wordpress }
      - { label: WordPress id, name: wpId, widget: hidden }
      - { label: Title, name: title, widget: string }
      - { label: Slug, name: slug, widget: string, hint: "The URL ends with this. Do not change it: that breaks links and the file name." }
      - label: Category
        name: category
        widget: relation
        collection: settings
        file: categories
        search_fields: ["categories.*.label"]
        value_field: "categories.*.slug"
        display_fields: ["categories.*.label"]
        hint: "Also the URL: /<category>/<slug>/. Changing it moves the page and breaks the old link."
      - { label: Categories (all), name: categories, widget: hidden, required: false }
      - label: Author
        name: author
        widget: relation
        collection: settings
        file: authors
        search_fields: ["authors.*.name"]
        value_field: "authors.*.slug"
        display_fields: ["authors.*.name"]
      - { label: Description, name: description, widget: text, hint: "The search snippet and card text." }
      - { label: Publish date, name: publishedDate, widget: datetime }
      - { label: Updated date, name: updatedDate, widget: datetime, required: false }
      - { label: Tags, name: tags, widget: list, required: false, default: [], hint: "Plain words. Only tags listed under Settings > Tags get a tag page." }
      - { label: Case study, name: isCaseStudy, widget: boolean, default: false }
      - label: Featured image
        name: hero
        widget: object
        required: false
        fields:
          - { label: Image path, name: image, widget: string, hint: "Where the file lives, e.g. /wp-content/uploads/2026/05/name.png" }
          - { label: Alt text, name: alt, widget: string, required: false }
          - { label: Width, name: width, widget: number, required: false }
          - { label: Height, name: height, widget: number, required: false }
          - { label: Media id, name: id, widget: hidden, required: false }
          - { label: Image sizes, name: srcSet, widget: hidden, required: false }
      - { label: Excerpt (WordPress), name: excerpt, widget: hidden, required: false }
      - { label: SEO title, name: seoTitle, widget: string, required: false }
      - { label: SEO description, name: seoDescription, widget: text, required: false }
      - { label: Social image, name: ogImage, widget: hidden, required: false }
      - { label: SEO head, name: seoHead, widget: text, required: false, hint: "The page's tags for Google and social sharing, as WordPress made them. Clear this box to rebuild them from the fields above (do that after changing the title, description or image)." }
      - { label: WordPress author, name: wpAuthor, widget: hidden, required: false }
      - { label: Body lead, name: bodyLead, widget: hidden, required: false }
      - label: TL;DR block
        name: tldrBlocks
        widget: object
        required: false
        fields:
          - { label: Heading, name: tldrHeading, widget: string, required: false }
          - { label: Summary, name: tldrDescription, widget: text, required: false }
          - label: Key points
            name: twoCol
            widget: list
            required: false
            summary: "{{fields.title}}"
            fields:
              - { label: Icon (HTML), name: icon, widget: string, required: false }
              - { label: Title, name: title, widget: string }
              - { label: Text, name: text, widget: text }
          - label: How Spenza helps
            name: oneCol
            widget: list
            required: false
            summary: "{{fields.title}}"
            fields:
              - { label: Icon (HTML), name: icon, widget: string, required: false }
              - { label: Title, name: title, widget: string }
              - { label: Text, name: text, widget: text }
      - { label: HTML body, name: body, widget: code, default_language: html, allow_language_selection: false, output_code_only: true, hint: "The post exactly as WordPress stored it. Edit the text; keep the tags and styles around it." }

  - name: guest_blog
    label: Guest blogs
    label_singular: Guest blog
    folder: src/content/cms-blog
    extension: mdx
    format: frontmatter
    create: true
    # The file name must equal the slug: the site builds /<category>/<slug>/ from it.
    slug: "{{fields.slug}}"
    identifier_field: slug
    # Posts imported from WordPress are in the next collection ("Imported posts"); this one is posts written here.
    filter: { field: source, value: guest }
    summary: "{{title}} · {{guestName}} · {{publishedDate | date('YYYY-MM-DD')}}"
    sortable_fields: [publishedDate, title, guestName]
    fields:
      - { label: Source, name: source, widget: hidden, default: guest }
      - { label: Title, name: title, widget: string }
      - label: Slug
        name: slug
        widget: string
        pattern: ['^[a-z0-9]+(?:-[a-z0-9]+)*$', "Lowercase letters, numbers and hyphens only."]
        hint: "The URL ends with this. Permanent once published: changing it breaks links."
      - { label: Category, name: category, widget: hidden, default: guest-blogs }
      # The guest is typed in here and stored on the post itself. Nothing is added to
      # Settings > Authors, because most guests write once.
      - { label: Guest name, name: guestName, widget: string, hint: "The author's full name, as it should appear on the post." }
      - { label: Designation, name: guestRole, widget: string, required: false, hint: "Job title, e.g. Head of Marketing. Shown beside the date and in the author box." }
      - { label: Company, name: guestCompany, widget: string, required: false, hint: "Employer, e.g. Acme Telecom." }
      - { label: Profile photo, name: guestPhoto, widget: image, required: false, hint: "Square, 300x300 or larger. Without one the post shows the guest's initials." }
      - { label: LinkedIn, name: guestLinkedin, widget: string, required: false, hint: "Full profile URL. Shown in the author box." }
      - label: Description
        name: description
        widget: text
        hint: "110-165 characters. Used as the search snippet, the social description and the card text."
      - { label: Publish date, name: publishedDate, widget: datetime, hint: "A future date holds the post back until that day." }
      - { label: Updated date, name: updatedDate, widget: datetime, required: false, hint: "Set only after a substantial edit." }
      - { label: Focus keyword, name: focusKeyword, widget: string, required: false }
      - label: Tags
        name: tags
        widget: relation
        collection: settings
        file: tags
        multiple: true
        required: false
        default: []
        search_fields: ["tags.*.label"]
        value_field: "tags.*.slug"
        display_fields: ["tags.*.label"]
        hint: "Each tag gets a page at /tag/<tag>/. Add new ones under Settings > Tags."
      - { label: SEO title, name: seoTitle, widget: string, required: false, hint: "Only if it should differ from the title. 70 characters or fewer." }

      - label: Hero image
        name: hero
        widget: object
        hint: "The featured image and social card. 1280x720 WebP, under 200 KB."
        fields:
          - { label: Image, name: image, widget: image }
          - { label: Alt text, name: alt, widget: string, hint: "Describe what the image shows. Never the title." }

      - label: Body image
        name: bodyImage
        widget: object
        required: false
        fields:
          - { label: Image, name: image, widget: image, required: false }
          - { label: Alt text, name: alt, widget: string, required: false }
          - { label: Caption, name: caption, widget: string, required: false }
          - { label: Show after section, name: afterSection, widget: number, value_type: int, min: 1, default: 2, hint: "The image appears at the end of this numbered section." }

      - label: TL;DR block
        name: tldr
        widget: object
        required: false
        hint: "The summary and five cards at the top. Leave empty to skip the block; otherwise it needs exactly 5 cards."
        fields:
          - { label: Summary, name: summary, widget: text, required: false, hint: "Two to four sentences that answer the title." }
          - label: Cards
            name: cards
            widget: list
            required: false
            min: 5
            max: 5
            hint: "Cards 1-4 are key points. Card 5 is the 'how Spenza helps' card."
            summary: "{{fields.title}}"
            fields:
              - { label: Icon, name: icon, widget: string, default: chart-line, hint: "A Font Awesome 6 solid name, e.g. chart-line, coins, circle-check, clipboard-check, gears." }
              - { label: Title, name: title, widget: string }
              - { label: Text, name: text, widget: text, hint: "One sentence, 160 characters or fewer." }

      - label: FAQ
        name: faq
        widget: list
        required: false
        summary: "{{fields.question}}"
        hint: "Five questions is the standard. Written as a search query; answered in 2-4 sentences."
        fields:
          - { label: Question, name: question, widget: string }
          - { label: Answer, name: answer, widget: text }

      - label: Body
        name: body
        widget: markdown
        modes: [rich_text, raw]
        buttons: [bold, italic, code, link, heading-two, heading-three, quote, bulleted-list, numbered-list]
        editor_components: [spenza-image, spenza-embed, spenza-button, spenza-callout]
        hint: "Use ## for sections and ### inside them (the title is already the H1). The + menu adds an image, a video, a button or a callout. Tables are supported."

  # The posts that were on WordPress, moved here as they were. Their body is the HTML WordPress stored
  # (some posts carry hand-built tables, cards and styles), so it is edited as HTML, not rich text.
  # Lists the posts draw from. Edited here, saved as JSON next to the posts, and
  # published like a post (Draft > In review > Ready > Publish).
  - name: settings
    label: Settings
    description: "Authors, categories and tags that posts choose from."
    files:
      - name: authors
        label: Authors
        file: src/content/cms-meta/authors.json
        fields:
          - label: Authors
            name: authors
            widget: list
            summary: "{{fields.name}}"
            fields:
              - label: URL name
                name: slug
                widget: string
                pattern: ['^[a-z0-9]+(?:-[a-z0-9]+)*$', "Lowercase letters, numbers and hyphens only."]
                hint: "The author page is /author/<this>/. Do not change it after posts use it."
              - { label: Name, name: name, widget: string }
              - { label: Role, name: role, widget: string, required: false, hint: "e.g. Head of Product. Shown on the author page." }
              - { label: Bio, name: bio, widget: text, required: false }
              - { label: Photo, name: avatar, widget: image, required: false, hint: "Square, 300x300 or larger." }
              - { label: LinkedIn, name: linkedin, widget: string, required: false }
      - name: categories
        label: Categories
        file: src/content/cms-meta/categories.json
        fields:
          - label: Categories
            name: categories
            widget: list
            summary: "{{fields.label}}"
            fields:
              - label: URL name
                name: slug
                widget: string
                pattern: ['^[a-z0-9]+(?:-[a-z0-9]+)*$', "Lowercase letters, numbers and hyphens only."]
                hint: "Posts live at /<this>/<post>/ and the archive at /category/<this>/. Permanent once a post uses it."
              - { label: Name, name: label, widget: string }
              - { label: Intro, name: intro, widget: text, required: false, hint: "One or two sentences under the archive heading." }
      - name: tags
        label: Tags
        file: src/content/cms-meta/tags.json
        fields:
          - label: Tags
            name: tags
            widget: list
            summary: "{{fields.label}}"
            fields:
              - label: URL name
                name: slug
                widget: string
                pattern: ['^[a-z0-9]+(?:-[a-z0-9]+)*$', "Lowercase letters, numbers and hyphens only."]
                hint: "The tag page is /tag/<this>/."
              - { label: Name, name: label, widget: string }
