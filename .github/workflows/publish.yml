# Build the site from this repo and deploy it.
#
# The site is static HTML in S3. Everything it shows lives in this repo: the
# marketing pages, the header and footer, and the blog posts written in the admin
# (spenza.com/admin, which edits through pull requests). Merging to main is what
# publishes. WordPress is not read at build time any more.
name: Publish

run-name: Publish

on:
  # A merge to main deploys itself. Without this every code change sat
  # unpublished until someone ran the workflow by hand — which is what
  # happened for every merge before it was added. The bot's own manifest
  # commit carries `[skip ci]`, so it does not loop. Docs and the WordPress
  # plugin sources change nothing that is built, so they do not deploy.
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'wordpress/**'

  workflow_dispatch:
    inputs:
      force:
        description: 'Deploy even if the build matches what is live'
        type: boolean
        default: false

# One publish at a time. Two overlapping runs would race on the S3 sync, and
# the later one could deploy an older build.
concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: write        # only to commit a refreshed media manifest
  id-token: write        # for OIDC, if the role below is ever configured

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      WP_ORIGIN:      ${{ vars.WP_ORIGIN      || 'https://preprod.spenza.com' }}
      SITE_URL:       ${{ vars.SITE_URL       || 'https://spenza.com' }}
      MEDIA_ORIGIN:   ${{ vars.MEDIA_ORIGIN   || 'https://media.spenza.com' }}
      # Where a lead form replays its submission so Gravity Forms sends the
      # confirmation and the sales alert. No default: leaving it unset ships
      # the behaviour this repo had before, which is HubSpot only and no mail.
      LEAD_ENDPOINT:  ${{ vars.LEAD_ENDPOINT }}
      HOST_REDIRECTS: '1'
      # Empty by default, so this workflow publishes an indexable production
      # site. It used to default to '1' from when the only thing it deployed
      # was staging, and that outlived the staging-only phase: the bucket
      # became www.spenza.com and every build kept shipping `Disallow: /` and a
      # noindex meta to the live site. Set the NOINDEX repo variable to 1 on any
      # environment that must stay out of the index — see scripts/lib/config.mjs
      # for why this is opt-out rather than opt-in.
      NOINDEX:        ${{ vars.NOINDEX }}
      MEDIA_BUCKET:   ${{ vars.MEDIA_BUCKET   || 'spenza-media' }}
      SITE_BUCKET:    ${{ vars.SITE_BUCKET    || 'spenza-site' }}
      AWS_REGION:     us-east-1

    steps:
      - uses: actions/checkout@v4
        with:
          # sitemap lastmod reads the last commit touching each page's source
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22.12'
          cache: npm

      - run: npm ci

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: us-east-1
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Build
        run: npm run build

      # Catches a reference that resolves locally but 404s once media is served
      # from elsewhere — the class of bug the two crawl-based audits cannot see.
      - name: Verify the build is self-consistent
        run: npm run wp:verify-dist -- "$MEDIA_ORIGIN"

      # The redirect table lives in the CloudFront Function, not in the bucket,
      # so a deploy alone never updates it. Eight redirects sat 404ing after
      # wp:redirects added them because nothing republished the function.
      #
      # Runs after the build because the generator filters the table against the
      # pages that were actually emitted, and idempotent: an unchanged function
      # republishes to the same behaviour.
      - name: Publish the router function
        run: bash scripts/aws-site-host.sh function

      # Skips itself when the build hashes identical to what is already live,
      # which is the common case on a schedule.
      - name: Deploy
        env:
          FORCE_DEPLOY: ${{ inputs.force && '1' || '' }}
        run: bash scripts/aws-site-host.sh deploy

      - name: Smoke-test what was deployed
        run: bash scripts/aws-site-host.sh verify

      # A copy of everything an editor writes, kept outside git: the posts, the
      # Settings files and the uploaded images. The repo stays the source of truth
      # (the admin edits through pull requests); this is the safety net if the repo
      # or the GitHub account is ever lost. The bucket is versioned, so an edit or a
      # delete can be undone, and each run also leaves a copy named by commit.
      # Never blocks a deploy: a backup that fails is reported, not fatal.
      - name: Back up the content to S3
        continue-on-error: true
        run: |
          tar -czf content.tar.gz src/content/cms-blog src/content/cms-meta public/cms-media
          aws s3 cp content.tar.gz s3://spenza-content-backup/latest/content.tar.gz
          aws s3 cp content.tar.gz "s3://spenza-content-backup/by-commit/${GITHUB_SHA}.tar.gz"
