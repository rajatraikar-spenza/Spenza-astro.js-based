# Generate a blog post with AI and open it as a Draft in the admin's editorial workflow.
#
# Started from spenza.com/admin/ai (the form calls this workflow's dispatch API
# with the editor's own GitHub token, so only people with write access to the
# repository can run it). The pipeline (scripts/ai-blog) researches, drafts,
# runs the five-advisor council until the post scores 91+ with no blockers,
# makes the hero and body images in the house style, and writes
# src/content/cms-blog/<slug>.mdx. This job commits that to a branch named
# cms/blog/<slug> and opens a pull request labelled decap-cms/draft, which is
# exactly what Decap's editorial workflow lists as a Draft. Nothing is published
# until a human moves it to Ready and presses Publish (which merges the PR).
#
# Secrets: ANTHROPIC_API_KEY (required), OPENAI_API_KEY (images; without it the
# post is drafted with no images and the editor uploads them).
# Repository setting required: Actions > General > "Allow GitHub Actions to create
# and approve pull requests".
name: AI blog post

run-name: "AI draft: ${{ inputs.title }} (${{ github.actor }})"

on:
  workflow_dispatch:
    inputs:
      title:
        description: Working title (becomes the headline)
        required: true
        type: string
      brief:
        description: Description - angle, audience, what it must cover
        required: true
        type: string
      author:
        description: Author
        required: true
        type: choice
        options: [isimplexity, sivasai, vinay]
        default: isimplexity
      category:
        description: Category (also the URL)
        required: true
        type: choice
        options: [telecom, iot, esim, mvno, byod, tem, spenza-product]
      focus_keyword:
        description: Focus keyword (optional)
        required: false
        type: string
      must_cover:
        description: Must-cover points, one per line (optional)
        required: false
        type: string
      links:
        description: Pages or sources to link, one URL per line (optional)
        required: false
        type: string
      images:
        description: Generate images?
        required: false
        type: choice
        options: [generate, skip]
        default: generate

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      WP_ORIGIN: ${{ vars.WP_ORIGIN || 'https://preprod.spenza.com' }}
      SITE_URL: ${{ vars.SITE_URL || 'https://spenza.com' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22.12'
          cache: npm

      - run: npm ci
      - run: npm ci --prefix scripts/ai-blog

      # Chrome renders the hero from the cover template. ubuntu-latest ships it;
      # this just proves it before spending model tokens.
      - name: Check Chrome
        run: google-chrome --version

      # Inputs reach the pipeline as environment variables, never spliced into a
      # command line: a brief containing quotes or $( ) must stay data.
      - name: Generate the post
        id: gen
        env:
          AI_TITLE: ${{ inputs.title }}
          AI_BRIEF: ${{ inputs.brief }}
          AI_AUTHOR: ${{ inputs.author }}
          AI_CATEGORY: ${{ inputs.category }}
          AI_KEYWORD: ${{ inputs.focus_keyword }}
          AI_MUST: ${{ inputs.must_cover }}
          AI_LINKS: ${{ inputs.links }}
          AI_IMAGES: ${{ inputs.images }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SPENZA_BRAIN_URL: ${{ secrets.SPENZA_BRAIN_URL }}
          SPENZA_BRAIN_TOKEN: ${{ secrets.SPENZA_BRAIN_TOKEN }}
        run: node scripts/ai-blog/run.mjs

      - name: Open the draft pull request
        env:
          GH_TOKEN: ${{ github.token }}
          SLUG: ${{ steps.gen.outputs.slug }}
          TITLE: ${{ inputs.title }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          branch="cms/blog/${SLUG}"
          git config user.name "spenza-ai-blog"
          git config user.email "ai-blog@users.noreply.github.com"
          git checkout -b "$branch"
          git add src/content/cms-blog public/cms-media
          git commit -m "Create Blog post “${SLUG}” (AI draft)" -m "Requested by ${ACTOR} from /admin/ai. Title: ${TITLE}"
          git push origin "$branch"

          # The labels Decap's editorial workflow reads its columns from.
          gh label create "decap-cms/draft"           --color "0e8a16" --description "Editorial workflow: Draft"      2>/dev/null || true
          gh label create "decap-cms/pending_review"  --color "fbca04" --description "Editorial workflow: In review"  2>/dev/null || true
          gh label create "decap-cms/pending_publish" --color "1d76db" --description "Editorial workflow: Ready"     2>/dev/null || true

          gh pr create --base main --head "$branch" \
            --title "Create Blog post “${SLUG}”" \
            --body-file ai-blog-report.md \
            --label "decap-cms/draft"

      - name: Keep the council transcript
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-blog-report
          path: |
            ai-blog-report.md
            ai-blog-report.json
          if-no-files-found: ignore
